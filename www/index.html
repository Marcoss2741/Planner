<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Planner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--c:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#2f6f5e;--on:#fff;--bd:#e3e1da}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--c:#202220;--tx:#eceae4;--mu:#9a9a92;--ac:#6cc3a8;--on:#10211b;--bd:#33362f}}
:root[data-theme="dark"]{--bg:#161715;--c:#202220;--tx:#eceae4;--mu:#9a9a92;--ac:#6cc3a8;--on:#10211b;--bd:#33362f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:15px;color:var(--mu);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;min-width:44px;padding:9px 0;border:1px solid var(--bd);background:var(--c);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.it{display:flex;gap:10px;align-items:center;background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px}
.it input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.it .b{flex:1;min-width:0}.it .t{font-size:12px;color:var(--mu)}.it.d .x{text-decoration:line-through;color:var(--mu)}
.it .b{cursor:pointer}
.ed{display:flex;flex-direction:column;gap:8px;background:var(--c);border:1px solid var(--ac);border-radius:12px;padding:10px;margin-top:8px}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}
button.p,button.s{padding:10px 14px;border-radius:10px;font:inherit;border:1px solid var(--ac);cursor:pointer}
button.p{background:var(--ac);color:var(--on)}button.s{background:none;color:var(--ac)}button:disabled{opacity:.5}
.add{width:100%;margin-top:8px}
</style></head><body><main>
<h1>📚 Meu Planner</h1>
<div class="tabs" id="tabs"></div>
<div id="plan"></div>
<h2>Projeto do semestre</h2>
<div id="proj"></div>
</main>
<script>
var D=[["seg","Seg"],["ter","Ter"],["qua","Qua"],["qui","Qui"],["sex","Sex"],["sab","Sáb"],["dom","Dom"]],K="planner-v2",n=0;
function nid(){return"i"+Date.now().toString(36)+(n++)}
function mk(t,x){return{id:nid(),t:t,x:x,d:false}}
function seed(){var d={};D.forEach(function(a){d[a[0]]=[]});
var base=[["06:00","Acordar"],["07:40","Sair de casa (leitura curta no trajeto)"],["09:00","Estágio"],["Almoço","Resumir 1 tópico da matéria (20 min)"],["17:00","Sair do estágio"]];
["seg","ter","qua","qui","sex"].forEach(function(k){base.forEach(function(b){d[k].push(mk(b[0],b[1]))})});
["seg","ter","sex"].forEach(function(k){d[k].push(mk("Noite","Faculdade"),mk("22:00","Chegar em casa"))});
d.qua.push(mk("Noite","Bloco de estudo (1h30)"));
d.qui.push(mk("19:30","Culto"));
d.sab.push(mk("Manhã","Bloco de estudo focado (2h)"));
d.dom.push(mk("Tarde","Descanso e lazer"));
return{days:d,proj:[mk("","Definir tema e grupo"),mk("","Pesquisar e reunir dados"),mk("","Montar a estrutura"),mk("","Escrever e revisar")].map(function(i){return{id:i.id,x:i.x,d:false}})}}
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){var o={days:{},proj:[]},fx=function(i){return{id:i&&i.id?String(i.id):nid(),t:String(i&&i.t||""),x:String(i&&i.x||""),d:!!(i&&i.d)}};
D.forEach(function(a){var l=s.days&&s.days[a[0]];o.days[a[0]]=Array.isArray(l)?l.map(fx):[]});
o.proj=(Array.isArray(s.proj)?s.proj:[]).map(fx);return o}
var S=load();S=S&&S.days?norm(S):seed();
var day=(new Date().getDay()+6)%7,ed=null,hist=null;
function item(i,list){
if(ed===i.id)return'<div class="ed">'+(list==="proj"?"":'<input type="text" id="et" placeholder="Horário ou momento" value="'+esc(i.t)+'">')+'<input type="text" id="ex" placeholder="Tarefa" value="'+esc(i.x)+'"><div class="row"><button class="p" data-a="ok" data-l="'+list+'" data-i="'+i.id+'">Salvar</button><button class="s" data-a="del" data-l="'+list+'" data-i="'+i.id+'">Excluir</button></div></div>';
return'<div class="it'+(i.d?" d":"")+'"><input type="checkbox" '+(i.d?"checked":"")+' data-a="chk" data-l="'+list+'" data-i="'+i.id+'"><div class="b" data-a="edit" data-i="'+i.id+'">'+(i.t?'<div class="t">'+esc(i.t)+'</div>':"")+'<div class="x">'+esc(i.x)+'</div></div></div>'}
function lst(list){return list==="proj"?S.proj:S.days[D[day][0]]}
function render(){
document.getElementById("tabs").innerHTML=D.map(function(a,i){return'<button class="'+(i===day?"on":"")+'" data-a="day" data-i="'+i+'">'+a[1]+'</button>'}).join("");
document.getElementById("plan").innerHTML=lst("day").map(function(i){return item(i,"day")}).join("")+'<button class="s add" data-a="add" data-l="day">+ Adicionar item</button>';
document.getElementById("proj").innerHTML=S.proj.map(function(i){return item(i,"proj")}).join("")+'<button class="s add" data-a="add" data-l="proj">+ Adicionar etapa</button>'}
document.addEventListener("click",function(e){
var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,l=t.dataset.l,i=t.dataset.i,L=l?lst(l):null,it=L&&L.filter(function(z){return z.id===i})[0];
if(a==="day"){day=+i;ed=null}
else if(a==="edit"){ed=i}
else if(a==="chk"){if(it)it.d=t.checked;save()}
else if(a==="ok"){if(it){var x=document.getElementById("ex").value.trim(),tt=document.getElementById("et");if(x)it.x=x;if(tt)it.t=tt.value.trim()}ed=null;save()}
else if(a==="del"){var k=L.indexOf(it);if(k>-1)L.splice(k,1);ed=null;save()}
else if(a==="add"){var ni={id:nid(),t:"",x:"Nova tarefa",d:false};L.push(ni);ed=ni.id}
render()});
render();
</script></body></html>
